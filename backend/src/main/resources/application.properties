# Default Profile - Use 'dev' or 'prod' for environment-specific configuration
spring.profiles.active=dev

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hirable
spring.datasource.username=hirable_user
spring.datasource.password=hirable_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# File Upload Configuration
hirable.file.upload-dir=./uploads/resumes
hirable.file.max-size=5242880

# JWT Configuration
hirable.jwt.secret=demo-secret-key-change-in-production-environment
hirable.jwt.expiration=86400000

# WebSocket Configuration
spring.websocket.allowed-origins=http://localhost:4200,http://localhost:3000

# Logging
logging.level.root=INFO
logging.level.com.hirable=DEBUG
