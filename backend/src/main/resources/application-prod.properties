# Production Environment Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration - Update these values for your production database
spring.datasource.url=jdbc:postgresql://prod-db-host:5432/hirable
spring.datasource.username=prod_hirable_user
spring.datasource.password=CHANGE_ME_IN_PRODUCTION
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# File Upload Configuration - Update path for production
hirable.file.upload-dir=/var/hirable/uploads/resumes
hirable.file.max-size=5242880

# JWT Configuration - MUST change secret in production
hirable.jwt.secret=CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET_KEY
hirable.jwt.expiration=86400000

# WebSocket Configuration - Update for production domain
spring.websocket.allowed-origins=https://yourdomain.com,https://www.yourdomain.com

# Logging - Less verbose for production
logging.level.root=WARN
logging.level.com.hirable=INFO

# CORS Configuration for production
spring.web.cors.allowed-origins=https://yourdomain.com,https://www.yourdomain.com
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Security headers
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
