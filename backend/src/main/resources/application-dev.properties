# Development Environment Configuration

# Server Configuration
server.port=8080
server.servlet.context-path=/

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/hirable
spring.datasource.username=hirable_user
spring.datasource.password=hirable_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.out-of-order=true
spring.flyway.validate-on-migrate=false

# File Upload Configuration
hirable.file.upload-dir=./uploads/resumes
hirable.file.max-size=5242880

# JWT Configuration
hirable.jwt.secret=dev-secret-key-for-development-only
hirable.jwt.expiration=86400000

# WebSocket Configuration
spring.websocket.allowed-origins=http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200

# Logging - More verbose for development
logging.level.root=INFO
logging.level.com.hirable=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# CORS Configuration for development
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:3000,http://127.0.0.1:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
