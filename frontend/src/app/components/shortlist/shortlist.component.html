<div class="shortlist-container">
  <h2>Shortlisted Candidates</h2>

  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner></mat-spinner>
  </div>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>

  <div *ngIf="!isLoading && shortlistedCandidates.length === 0" class="empty-state">
    <p>No candidates in your shortlist yet.</p>
  </div>

  <div *ngIf="!isLoading && shortlistedCandidates.length > 0" class="candidates-grid">
    <mat-card *ngFor="let candidate of shortlistedCandidates" class="candidate-card">
      <mat-card-header>
        <mat-card-title>{{ candidate.firstName }} {{ candidate.lastName }}</mat-card-title>
        <mat-card-subtitle>{{ candidate.location }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p class="summary">{{ candidate.summary }}</p>

        <div class="skills-section">
          <h4>Skills</h4>
          <mat-chip-set aria-label="Skills">
            <mat-chip *ngFor="let skill of candidate.skills">{{ skill }}</mat-chip>
          </mat-chip-set>
        </div>

        <p class="added-date">Added: {{ candidate.addedAt | date: 'short' }}</p>
      </mat-card-content>

      <mat-card-actions>
        <button mat-button (click)="viewCandidateProfile(candidate.jobSeekerId)">
          <mat-icon>person</mat-icon>
          View Profile
        </button>
        <button mat-button color="warn" (click)="removeFromShortlist(candidate.jobSeekerId)">
          <mat-icon>delete</mat-icon>
          Remove
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
