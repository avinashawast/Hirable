<div class="notification-container">
  <button mat-icon-button (click)="toggleNotifications()" class="notification-bell">
    <mat-icon matBadge="{{ unreadCount }}" matBadgeColor="warn" matBadgeSize="small">
      notifications
    </mat-icon>
  </button>

  <div class="notification-panel" *ngIf="showNotifications">
    <div class="notification-header">
      <h3>Notifications</h3>
      <button mat-icon-button (click)="toggleNotifications()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="notification-list">
      <div *ngIf="notifications.length === 0" class="no-notifications">
        <p>No notifications</p>
      </div>

      <div *ngFor="let notification of notifications" 
           class="notification-item" 
           [class.unread]="!notification.read"
           (click)="markAsRead(notification)">
        <mat-icon class="notification-icon">{{ getNotificationIcon(notification.type) }}</mat-icon>
        <div class="notification-content">
          <p class="notification-message">{{ notification.message }}</p>
          <span class="notification-time">{{ notification.createdAt | date: 'short' }}</span>
        </div>
        <div class="notification-status" *ngIf="!notification.read">
          <span class="unread-badge"></span>
        </div>
      </div>
    </div>
  </div>
</div>
