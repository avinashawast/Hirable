<div class="company-profile-container">
  <h2>Company Profile</h2>

  <div *ngIf="loading" class="loading">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading your company profile...</p>
  </div>

  <form *ngIf="!loading" (ngSubmit)="saveProfile()" class="profile-form">
    <!-- Contact Information Section -->
    <div class="form-section">
      <h3 class="section-title">Contact Information</h3>
      <div class="form-fields">
        <div class="form-field-row">
          <mat-form-field appearance="outline">
            <mat-label>First Name</mat-label>
            <input matInput [(ngModel)]="profile.firstName" name="firstName" required>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Last Name</mat-label>
            <input matInput [(ngModel)]="profile.lastName" name="lastName" required>
          </mat-form-field>
        </div>
        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput [(ngModel)]="profile.phone" name="phone" required>
        </mat-form-field>
      </div>
    </div>

    <!-- Company Information Section -->
    <div class="form-section">
      <h3 class="section-title">Company Information</h3>
      <div class="form-fields">
        <mat-form-field appearance="outline">
          <mat-label>Company Name</mat-label>
          <input matInput [(ngModel)]="profile.companyName" name="companyName" required>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Company Website</mat-label>
          <input matInput [(ngModel)]="profile.companyWebsite" name="companyWebsite" placeholder="https://example.com">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Industry</mat-label>
          <mat-select [(ngModel)]="profile.industry" name="industry" required>
            <mat-option *ngFor="let industry of industries" [value]="industry.name">
              {{ industry.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <!-- Company Description Section -->
    <div class="form-section">
      <h3 class="section-title">Company Description</h3>
      <div class="form-fields">
        <mat-form-field appearance="outline">
          <mat-label>Description</mat-label>
          <textarea matInput [(ngModel)]="profile.companyDescription" name="companyDescription" rows="4" placeholder="Tell us about your company..."></textarea>
        </mat-form-field>
      </div>
    </div>

    <div class="form-actions">
      <button mat-raised-button type="button">Cancel</button>
      <button mat-raised-button color="primary" type="submit">Save Profile</button>
    </div>
  </form>
</div>
