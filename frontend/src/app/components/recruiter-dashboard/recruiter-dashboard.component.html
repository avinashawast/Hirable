<div class="recruiter-dashboard-container">
  <div class="header">
    <h2>My Job Postings</h2>
    <button mat-raised-button color="primary" (click)="postNewJob()">Post New Job</button>
  </div>

  <div *ngIf="loading" class="loading">Loading...</div>

  <div *ngIf="!loading && jobs.length === 0" class="no-jobs">
    <p>No jobs posted yet. <a (click)="postNewJob()" style="cursor: pointer; color: #1976d2;">Post your first job</a></p>
  </div>

  <table mat-table [dataSource]="jobs" *ngIf="!loading && jobs.length > 0" class="jobs-table">
    <!-- Title Column -->
    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef>Job Title</th>
      <td mat-cell *matCellDef="let element">{{ element.title }}</td>
    </ng-container>

    <!-- Location Column -->
    <ng-container matColumnDef="location">
      <th mat-header-cell *matHeaderCellDef>Location</th>
      <td mat-cell *matCellDef="let element">{{ element.location }}</td>
    </ng-container>

    <!-- Status Column -->
    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let element">
        <mat-chip [color]="getStatusColor(element.status)" selected>
          {{ element.status }}
        </mat-chip>
      </td>
    </ng-container>

    <!-- Posted At Column -->
    <ng-container matColumnDef="postedAt">
      <th mat-header-cell *matHeaderCellDef>Posted</th>
      <td mat-cell *matCellDef="let element">{{ element.postedAt | date: 'short' }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button (click)="editJob(element.id)" title="Edit">
          ✎
        </button>
        <button mat-icon-button (click)="deleteJob(element.id)" title="Delete">
          ✕
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
