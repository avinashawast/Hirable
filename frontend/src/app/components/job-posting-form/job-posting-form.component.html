<div class="job-posting-form-container">
  <h2>Post a New Job</h2>

  <form (ngSubmit)="submitForm()">
    <mat-form-field appearance="fill">
      <mat-label>Job Title</mat-label>
      <input matInput [(ngModel)]="job.title" name="title" required>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Job Description</mat-label>
      <textarea matInput [(ngModel)]="job.description" name="description" rows="6" required></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Location</mat-label>
      <input matInput [(ngModel)]="job.location" name="location" required>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Experience Level</mat-label>
      <input matInput [(ngModel)]="job.experienceLevel" name="experienceLevel" placeholder="e.g., ENTRY, MID, SENIOR">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Industry</mat-label>
      <mat-select [(ngModel)]="job.industry" name="industry">
        <mat-option *ngFor="let industry of industries" [value]="industry.name">
          {{ industry.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="skills-section">
      <mat-form-field appearance="fill">
        <mat-label>Select Required Skills</mat-label>
        <mat-select [(ngModel)]="skillInput" name="skillInput">
          <mat-option *ngFor="let skill of skills" [value]="skill.name">
            {{ skill.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-raised-button type="button" (click)="addSkill()">Add Skill</button>
    </div>

    <div class="skills-list" *ngIf="job.requiredSkills.length > 0">
      <mat-chip-set>
        <mat-chip *ngFor="let skill of job.requiredSkills; let i = index" (removed)="removeSkill(i)">
          {{ skill }}
          <button matChipRemove>×</button>
        </mat-chip>
      </mat-chip-set>
    </div>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading">
      {{ loading ? 'Posting...' : 'Post Job' }}
    </button>
  </form>
</div>
