<div class="job-posting-form-container">
  <h2>Post a New Job</h2>

  <form (ngSubmit)="submitForm()">
    <mat-form-field appearance="fill">
      <mat-label>Job Title *</mat-label>
      <input matInput [(ngModel)]="job.title" name="title" required placeholder="e.g., Senior Software Engineer">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Job Description *</mat-label>
      <textarea matInput [(ngModel)]="job.description" name="description" rows="6" required placeholder="Describe the role, responsibilities, and requirements..."></textarea>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Location *</mat-label>
      <input matInput [(ngModel)]="job.location" name="location" required placeholder="e.g., New York, NY or Remote">
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Experience Level</mat-label>
      <mat-select [(ngModel)]="job.experienceLevel" name="experienceLevel">
        <mat-option value="">Select Level</mat-option>
        <mat-option value="ENTRY">Entry Level</mat-option>
        <mat-option value="MID">Mid Level</mat-option>
        <mat-option value="SENIOR">Senior Level</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Industry</mat-label>
      <mat-select [(ngModel)]="job.industry" name="industry">
        <mat-option value="">Select Industry</mat-option>
        <mat-option *ngFor="let industry of industries" [value]="industry.name">
          {{ industry.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <div class="skills-section">
      <mat-form-field appearance="fill">
        <mat-label>Required Skills</mat-label>
        <mat-select [(ngModel)]="skillInput" name="skillInput">
          <mat-option value="">Select a skill</mat-option>
          <mat-option *ngFor="let skill of skills" [value]="skill.name">
            {{ skill.name }}
          </mat-option>
        </mat-select>
      </mat-form-field>
      <button mat-raised-button type="button" (click)="addSkill()" color="accent">Add Skill</button>
    </div>

    <div class="skills-list" *ngIf="job.requiredSkills.length > 0">
      <mat-chip-set>
        <mat-chip *ngFor="let skill of job.requiredSkills; let i = index" (removed)="removeSkill(i)">
          {{ skill }}
          <button matChipRemove>×</button>
        </mat-chip>
      </mat-chip-set>
    </div>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading">
      {{ loading ? 'Posting...' : 'Post Job' }}
    </button>
  </form>
</div>
